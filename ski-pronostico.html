<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ski Central Andes · Pronóstico de nieve</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      keyframes: { aurora: { '0%,100%': { transform: 'translate3d(0,0,0) scale(1)' }, '50%': { transform: 'translate3d(4%,-3%,0) scale(1.12)' } }, spinSlow: { to: { transform: 'rotate(360deg)' } }, grow: { from: { transform: 'scaleX(0)' } } },
      animation: { aurora: 'aurora 14s ease-in-out infinite', spinSlow: 'spinSlow 1s linear infinite' } } } };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <style>
    :root{ --ink:#eaf4ff; }
    html, body { height:100%; overflow:hidden; font-family:'Inter', ui-sans-serif, system-ui, sans-serif; }
    body { background:#070e1c; color:var(--ink); }
    #aurora{ position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(64px); opacity:.5; }
    #aurora .b{ position:absolute; border-radius:50%; mix-blend-mode:screen; animation:aurora 15s ease-in-out infinite; }
    #aurora .b1{ width:55vw; height:55vw; left:-8%; top:-12%; background:radial-gradient(circle, rgba(34,211,238,.55), transparent 62%); }
    #aurora .b2{ width:50vw; height:50vw; right:-6%; top:-4%; background:radial-gradient(circle, rgba(167,139,250,.5), transparent 62%); animation-delay:-5s; }
    #aurora .b3{ width:65vw; height:65vw; left:15%; bottom:-30%; background:radial-gradient(circle, rgba(56,189,248,.4), transparent 60%); animation-delay:-9s; }
    #viewport { position:fixed; inset:0; display:grid; place-items:center; z-index:1; }
    #stage { width:1600px; height:900px; transform-origin:center center; transform:scale(var(--s,1)); display:flex; flex-direction:column; padding:22px; gap:14px; }
    .grotesk{ font-family:'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
    .tabnum{ font-variant-numeric:tabular-nums; }
    .card { position:relative; border-radius:26px; background:linear-gradient(160deg, rgba(30,44,74,.55), rgba(12,20,38,.42)); border:1px solid rgba(148,180,220,.14); box-shadow:0 10px 34px rgba(0,0,0,.45); backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%); }
    .grad-name{ background:linear-gradient(100deg,#a5f3fc 0%, #38bdf8 42%, #a78bfa 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .grad-snow{ background:linear-gradient(180deg,#ffffff, #7dd3fc); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 18px rgba(125,211,252,.35)); }
    .pill{ display:inline-flex; align-items:center; gap:.4rem; border-radius:999px; font-weight:700; }
    .bar{ height:100%; border-radius:999px; transform-origin:left; transition:width .8s cubic-bezier(.2,.7,.2,1); }
    .row-glow{ box-shadow:0 0 22px rgba(34,211,238,.12); }
    @media (max-width:820px){
      html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important}
      #aurora{position:fixed}
      #viewport{position:static!important;display:block!important;height:auto!important}
      #stage{position:static!important;width:100%!important;height:auto!important;transform:none!important;padding:14px!important;gap:14px!important;overflow-x:hidden!important}
      #stage .flex{flex-wrap:wrap!important}
      #stage header{flex-direction:column!important;align-items:stretch!important;gap:12px!important}
      #stage header > *{width:100%!important;text-align:left!important;border:0!important;justify-content:flex-start!important}
      #stage [class*="grid-cols-"]{grid-template-columns:1fr!important}
      #rankBox{max-height:none!important;overflow:visible!important}
      .card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:linear-gradient(160deg, rgba(24,37,64,.96), rgba(12,20,38,.96))!important}
      #heroTop{font-size:2.4rem!important} #heroTotal{font-size:3rem!important}
      #stage .hero7{grid-template-columns:repeat(7,minmax(44px,1fr))!important}
    }
  </style>
</head>
<body class="antialiased">
<div id="aurora"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
<div id="viewport"><div id="stage">

  <!-- HEADER -->
  <header class="card px-5 py-3 flex items-center justify-between gap-5 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <div class="h-12 w-12 rounded-2xl grid place-items-center shrink-0" style="background:linear-gradient(140deg,rgba(34,211,238,.25),rgba(167,139,250,.25));border:1px solid rgba(34,211,238,.4)"><i data-lucide="cloud-snow" class="w-7 h-7 text-[#7dd3fc]" style="filter:drop-shadow(0 0 8px rgba(34,211,238,.6))"></i></div>
      <div class="min-w-0">
        <p class="grotesk text-2xl font-bold tracking-tight leading-none flex items-center gap-2.5"><span class="grad-name">PRONÓSTICO DE NIEVE</span> <span class="fi fi-cl" style="font-size:.8em;border-radius:3px"></span></p>
        <p class="text-xs text-slate-400 mt-1 flex items-center gap-2"><span class="pill text-[10px] px-2 py-0.5" style="background:rgba(34,211,238,.15);color:#67e8f9">Ranking powder · próximos 7 días</span> Ski Central Andes</p>
      </div>
    </div>
    <div class="text-right shrink-0 px-5 border-x border-white/10">
      <p id="clock" class="grotesk text-3xl font-bold tracking-tight leading-none tabnum">--:--:--</p>
      <p id="clockDate" class="text-xs text-slate-400 mt-1 capitalize">hora local · Chile</p>
    </div>
    <button id="refreshBtn" class="card rounded-xl h-10 w-10 grid place-items-center hover:brightness-125 transition active:scale-95 shrink-0" title="Actualizar"><i id="refreshIcon" data-lucide="refresh-cw" class="w-5 h-5"></i></button>
  </header>

  <!-- HERO -->
  <section class="card px-6 py-5 flex items-center gap-8 shrink-0">
    <div class="shrink-0">
      <p class="text-[11px] uppercase tracking-[0.2em] text-[#7dd3fc] flex items-center gap-2"><i data-lucide="trophy" class="w-4 h-4"></i> Más powder esperado</p>
      <h1 id="heroTop" class="grotesk grad-name text-4xl font-bold tracking-tight mt-1">—</h1>
      <p id="heroTopMeta" class="text-sm text-slate-400 mt-1">—</p>
    </div>
    <div class="h-16 w-px bg-white/10 shrink-0 hidden sm:block"></div>
    <div class="shrink-0 text-center">
      <p class="text-[11px] uppercase tracking-wider text-slate-400">Nieve · 7 días</p>
      <p class="grotesk"><span id="heroTotal" class="grad-snow text-5xl font-bold tabnum">--</span> <span class="text-lg text-slate-400">cm</span></p>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-[11px] uppercase tracking-wider text-slate-400 mb-2">Día a día · <span id="heroTopName" class="text-slate-300">—</span></p>
      <div id="hero7" class="hero7 grid grid-cols-7 gap-2"></div>
    </div>
  </section>

  <!-- RANKING -->
  <main class="card px-5 py-4 flex-1 min-h-0 flex flex-col">
    <div class="flex items-center justify-between mb-3 shrink-0">
      <p class="text-sm font-bold flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-5 h-5 text-[#7dd3fc]"></i> Ranking de centros · nieve próximos 7 días</p>
      <p class="text-xs text-slate-500">Open-Meteo · corrige altitud · actualiza cada 30 min</p>
    </div>
    <div id="rankBox" class="flex-1 min-h-0 overflow-y-auto pr-1 space-y-1.5"></div>
  </main>

</div></div>

<script>
  const TZ='America/Santiago', REFRESH_MS=30*60*1000, DAYS=7;
  const $=id=>document.getElementById(id);
  const drawIcons=()=>window.lucide&&lucide.createIcons();
  const ZCOL={ 'Central':'#22d3ee','Centro-Sur':'#34d399','Sur':'#a78bfa','Austral':'#f472b6' };
  const num=v=>(v==null?'--':(Math.round(v*10)/10).toLocaleString('es-CL'));
  const CENTROS=[
    {nombre:'Valle Nevado',zona:'Central',lat:-33.3556,lon:-70.2506,elev:2860},
    {nombre:'El Colorado',zona:'Central',lat:-33.3536,lon:-70.2933,elev:2560},
    {nombre:'La Parva',zona:'Central',lat:-33.3286,lon:-70.2856,elev:2750},
    {nombre:'Ski Portillo',zona:'Central',lat:-32.8342,lon:-70.1289,elev:2680},
    {nombre:'Parques de Farellones',zona:'Central',lat:-33.3536,lon:-70.2989,elev:2340},
    {nombre:'Lagunillas',zona:'Central',lat:-33.9800,lon:-70.0800,elev:2200},
    {nombre:'Ski El Arpa',zona:'Central',lat:-32.6600,lon:-70.4000,elev:2690},
    {nombre:'Chapa Verde',zona:'Centro-Sur',lat:-34.2800,lon:-70.3000,elev:2370},
    {nombre:'Nevados de Chillán',zona:'Centro-Sur',lat:-36.9053,lon:-71.4058,elev:1650},
    {nombre:'Volcán Antuco',zona:'Centro-Sur',lat:-37.3500,lon:-71.3800,elev:1850},
    {nombre:'Corralco',zona:'Sur',lat:-38.4386,lon:-71.5133,elev:1550},
    {nombre:'Centro de Montaña Pillán',zona:'Sur',lat:-39.4000,lon:-71.9500,elev:1200},
    {nombre:'Las Araucarias',zona:'Sur',lat:-38.6700,lon:-71.7600,elev:1550},
    {nombre:'Antillanca',zona:'Sur',lat:-40.7780,lon:-72.1560,elev:1050},
    {nombre:'Volcán Osorno',zona:'Sur',lat:-41.1053,lon:-72.4962,elev:1200},
    {nombre:'El Fraile',zona:'Austral',lat:-45.6600,lon:-71.8000,elev:1599},
    {nombre:'Club Andino · Cerro Mirador',zona:'Austral',lat:-53.1300,lon:-71.0200,elev:600},
  ];

  function fitStage(){ const w=innerWidth||1600,h=innerHeight||900; $('stage').style.setProperty('--s',Math.min(w/1600,h/900)||1); }
  addEventListener('resize',fitStage); addEventListener('load',fitStage); fitStage();
  function tick(){ const n=new Date();
    $('clock').textContent=n.toLocaleTimeString('es-CL',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    $('clockDate').textContent=n.toLocaleDateString('es-CL',{timeZone:TZ,weekday:'long',day:'2-digit',month:'long'})+' · hora Chile';
  }
  function url(c){ return 'https://api.open-meteo.com/v1/forecast'
    +`?latitude=${c.lat}&longitude=${c.lon}&elevation=${c.elev}&timezone=${encodeURIComponent(TZ)}`
    +`&daily=snowfall_sum,temperature_2m_max,temperature_2m_min,weather_code&forecast_days=${DAYS}`; }

  let datos=[];
  async function load(){
    const ic=$('refreshIcon'); ic.classList.add('animate-spinSlow');
    try{
      datos = await Promise.all(CENTROS.map(async c=>{
        try{ const r=await fetch(url(c)); const j=await r.json();
          const arr=(j.daily&&j.daily.snowfall_sum)||[];
          const total=arr.slice(0,DAYS).reduce((a,b)=>a+(b||0),0);
          return { c, total, dias:arr.slice(0,DAYS), tmax:j.daily.temperature_2m_max, tmin:j.daily.temperature_2m_min, time:j.daily.time };
        }catch(e){ return { c, total:0, dias:[], err:1 }; }
      }));
      render();
    } finally { ic.classList.remove('animate-spinSlow'); }
    clearTimeout(load._t); load._t=setTimeout(load, REFRESH_MS);
  }

  function render(){
    if(!datos.length) return;
    const rank=[...datos].sort((a,b)=>b.total-a.total);
    const top=rank[0], max=Math.max(1,...rank.map(d=>d.total));
    // hero
    $('heroTop').textContent = top.c.nombre;
    $('heroTopName').textContent = top.c.nombre;
    $('heroTopMeta').textContent = `Zona ${top.c.zona} · ~${top.c.elev.toLocaleString('es-CL')} m`;
    $('heroTotal').textContent = num(top.total);
    // strip 7 días del top
    let hs='';
    (top.dias||[]).forEach((s,i)=>{
      const d = top.time? new Date(top.time[i]+'T12:00:00') : null;
      const dl = i===0?'Hoy':(d?d.toLocaleDateString('es-CL',{timeZone:TZ,weekday:'short'}):'');
      const strong = s>=5;
      hs+=`<div class="rounded-xl px-1 py-2 text-center" style="${strong?'background:linear-gradient(180deg,rgba(34,211,238,.18),rgba(167,139,250,.1));border:1px solid rgba(34,211,238,.35)':'background:rgba(148,180,220,.06);border:1px solid rgba(148,180,220,.1)'}">
        <p class="text-[10px] text-slate-400 capitalize">${dl}</p>
        <p class="grotesk text-base font-bold tabnum ${strong?'grad-snow':'text-slate-200'}">${num(s)}</p>
        <p class="text-[9px] text-slate-500">cm</p></div>`;
    });
    $('hero7').innerHTML = hs;
    // ranking
    $('rankBox').innerHTML = rank.map((d,idx)=>{
      const z=ZCOL[d.c.zona]||'#22d3ee', w=Math.max(2,Math.round(d.total/max*100));
      const podium = idx<3;
      const medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
      return `<div class="flex items-center gap-3 rounded-xl px-3 py-2 ${podium?'row-glow':''}" style="background:${podium?'rgba(34,211,238,.07)':'rgba(148,180,220,.04)'};border:1px solid ${podium?'rgba(34,211,238,.22)':'rgba(148,180,220,.08)'}">
        <div class="grotesk text-lg font-bold tabnum w-8 text-center shrink-0 ${podium?'text-[#7dd3fc]':'text-slate-500'}">${medal||(idx+1)}</div>
        <div class="min-w-0" style="width:210px">
          <p class="text-sm font-semibold truncate">${d.c.nombre}</p>
          <p class="text-[11px]" style="color:${z}">Zona ${d.c.zona}</p>
        </div>
        <div class="flex-1 h-3 rounded-full min-w-0" style="background:rgba(148,180,220,.1)"><div class="bar" style="width:${w}%;background:linear-gradient(90deg,${z},#a78bfa)"></div></div>
        <div class="grotesk text-lg font-bold tabnum shrink-0 text-right" style="width:88px">${num(d.total)}<span class="text-xs text-slate-400 font-normal"> cm</span></div>
      </div>`;
    }).join('');
    drawIcons();
  }

  $('refreshBtn').addEventListener('click', load);
  tick(); setInterval(tick,1000); drawIcons(); load();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ clearTimeout(load._t); load(); } });
</script>
</body>
</html>
