<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ski Central Andes · Estado de la montaña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      keyframes: { spinSlow: { to: { transform: 'rotate(360deg)' } }, aurora: { '0%,100%': { transform: 'translate3d(0,0,0) scale(1)' }, '50%': { transform: 'translate3d(4%,-3%,0) scale(1.12)' } }, floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } } },
      animation: { spinSlow: 'spinSlow 1s linear infinite', aurora: 'aurora 14s ease-in-out infinite', floaty: 'floaty 4s ease-in-out infinite' } } } };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <style>
    :root{ --cyan:#22d3ee; --sky:#38bdf8; --violet:#a78bfa; --mint:#5eead4; --pink:#f472b6; --ink:#eaf4ff; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    body { background:#070e1c; color: var(--ink); }
    #aurora{ position:fixed; inset:-20%; z-index:0; pointer-events:none; filter: blur(60px); opacity:.55; }
    #aurora .b{ position:absolute; border-radius:50%; mix-blend-mode:screen; animation: aurora 14s ease-in-out infinite; }
    #aurora .b1{ width:55vw; height:55vw; left:-8%; top:-12%; background: radial-gradient(circle, rgba(34,211,238,.55), transparent 62%); }
    #aurora .b2{ width:50vw; height:50vw; right:-6%; top:-8%; background: radial-gradient(circle, rgba(167,139,250,.5), transparent 62%); animation-delay:-5s; }
    #aurora .b3{ width:60vw; height:60vw; left:20%; bottom:-25%; background: radial-gradient(circle, rgba(56,189,248,.4), transparent 60%); animation-delay:-9s; }
    #viewport { position: fixed; inset: 0; display: grid; place-items: center; z-index:1; }
    #stage { width: 1600px; height: 900px; transform-origin: center center; transform: scale(var(--s, 1)); display: flex; flex-direction: column; padding: 22px; gap: 14px; }
    .grotesk{ font-family:'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
    .tabnum { font-variant-numeric: tabular-nums; }
    .card { position:relative; border-radius: 26px; background: linear-gradient(160deg, rgba(30,44,74,.55), rgba(12,20,38,.42)); border: 1px solid rgba(148,180,220,.14); box-shadow: 0 10px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(200,230,255,.06); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
    .grad-name{ background: linear-gradient(100deg,#a5f3fc 0%, #38bdf8 42%, #a78bfa 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .glow-cyan{ filter: drop-shadow(0 0 8px rgba(34,211,238,.6)); }
    .pill{ display:inline-flex; align-items:center; gap:.4rem; border-radius:999px; font-weight:700; }
    .chip-ico{ display:grid; place-items:center; border-radius:14px; }
    .row-c{ border-radius:16px; background:rgba(148,180,220,.05); border:1px solid rgba(148,180,220,.1); }
    @keyframes txtfade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform:none;} }
    .fade { animation: txtfade .4s ease both; }

    @media (max-width: 820px){
      html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important}
      #aurora{ position:fixed; filter:blur(50px); opacity:.5; }
      #viewport{position:static!important;display:block!important;place-items:stretch!important;inset:auto!important;height:auto!important}
      #stage{position:static!important;width:100%!important;max-width:100vw!important;height:auto!important;transform:none!important;transform-origin:top left!important;padding:14px!important;padding-bottom:30px!important;gap:14px!important;overflow-x:hidden!important}
      #stage header{flex-direction:column!important;align-items:stretch!important;gap:12px!important}
      #stage header > *{width:100%!important;text-align:left!important;border:0!important;justify-content:flex-start!important}
      #board{grid-template-columns:1fr!important;overflow:visible!important}
      .card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:linear-gradient(160deg, rgba(24,37,64,.96), rgba(12,20,38,.96))!important}
      #clock,#clockDate{display:none!important} *:has(> #clock){display:none!important}
    }
  </style>
</head>
<body class="antialiased">
<div id="aurora"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
<div id="viewport"><div id="stage">

  <!-- CABECERA -->
  <header class="card px-5 py-3 flex items-center justify-between gap-5 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <div class="h-12 w-12 rounded-2xl grid place-items-center shrink-0 animate-floaty" style="background:linear-gradient(140deg,rgba(34,211,238,.25),rgba(167,139,250,.25));border:1px solid rgba(34,211,238,.4)">
        <i data-lucide="mountain-snow" class="w-7 h-7 text-[#7dd3fc] glow-cyan"></i>
      </div>
      <div class="min-w-0">
        <p class="grotesk text-2xl font-bold tracking-tight leading-none flex items-center gap-2.5"><span class="grad-name">ESTADO DE LA MONTAÑA</span> <span class="fi fi-cl" style="font-size:.85em;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span></p>
        <p class="text-xs text-slate-400 mt-1 flex items-center gap-2"><span class="pill text-[10px] px-2 py-0.5" style="background:rgba(34,211,238,.15);color:#67e8f9">Ski Central Andes · 17 centros</span> condición esquiable de un vistazo</p>
      </div>
    </div>
    <div class="text-right shrink-0 px-5 border-x border-white/10">
      <p id="clock" class="grotesk text-3xl font-bold tracking-tight leading-none tabnum">--:--:--</p>
      <p id="clockDate" class="text-xs text-slate-400 mt-1 capitalize">hora local · Chile</p>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <span id="counter" class="text-xs text-slate-400 tabnum">—</span>
      <button id="refreshBtn" class="card rounded-xl h-9 w-9 grid place-items-center hover:brightness-125 transition active:scale-95" title="Actualizar"><i id="refreshIcon" data-lucide="refresh-cw" class="w-5 h-5"></i></button>
    </div>
  </header>

  <!-- RESUMEN -->
  <section class="card px-5 py-3 shrink-0 flex items-center gap-4 flex-wrap">
    <p class="text-sm font-bold flex items-center gap-2 shrink-0"><i data-lucide="sparkles" class="w-5 h-5 text-[#7dd3fc]"></i> Destacado hoy:</p>
    <p id="bestCentro" class="grotesk text-lg font-bold grad-name">—</p>
    <div id="summaryChips" class="flex flex-wrap gap-2 ml-auto"></div>
  </section>

  <!-- TABLERO -->
  <main id="board" class="grid grid-cols-2 gap-3 flex-1 min-h-0 content-start"></main>

  <p class="text-[11px] text-slate-500 shrink-0 text-center">Estado estimado desde el clima (base, nieve fresca, viento y visibilidad) vía Open-Meteo · referencial, confirma apertura y pistas habilitadas con cada centro.</p>

</div></div>

<script>
  const TZ = 'America/Santiago';
  const PAST = 2, TODAY = PAST;
  const REFRESH_MS = 10 * 60 * 1000;
  const $ = (id) => document.getElementById(id);
  const drawIcons = () => window.lucide && lucide.createIcons();
  const round = (v) => (v == null ? '--' : Math.round(v));

  const ZCOL = { 'Central':'#22d3ee', 'Centro-Sur':'#34d399', 'Sur':'#a78bfa', 'Austral':'#f472b6' };
  const CENTROS = [
    { nombre: 'Valle Nevado',        zona: 'Central', lat: -33.3556, lon: -70.2506, elev: 2860 },
    { nombre: 'El Colorado',         zona: 'Central', lat: -33.3536, lon: -70.2933, elev: 2560 },
    { nombre: 'La Parva',            zona: 'Central', lat: -33.3286, lon: -70.2856, elev: 2750 },
    { nombre: 'Ski Portillo',        zona: 'Central', lat: -32.8342, lon: -70.1289, elev: 2680 },
    { nombre: 'Parques de Farellones', zona: 'Central', lat: -33.3536, lon: -70.2989, elev: 2340 },
    { nombre: 'Lagunillas',          zona: 'Central', lat: -33.9800, lon: -70.0800, elev: 2200 },
    { nombre: 'Ski El Arpa',         zona: 'Central', lat: -32.6600, lon: -70.4000, elev: 2690 },
    { nombre: 'Chapa Verde',         zona: 'Centro-Sur', lat: -34.2800, lon: -70.3000, elev: 2370 },
    { nombre: 'Nevados de Chillán',  zona: 'Centro-Sur', lat: -36.9053, lon: -71.4058, elev: 1650 },
    { nombre: 'Volcán Antuco',       zona: 'Centro-Sur', lat: -37.3500, lon: -71.3800, elev: 1850 },
    { nombre: 'Corralco',            zona: 'Sur', lat: -38.4386, lon: -71.5133, elev: 1550 },
    { nombre: 'Centro de Montaña Pillán', zona: 'Sur', lat: -39.4000, lon: -71.9500, elev: 1200 },
    { nombre: 'Las Araucarias',      zona: 'Sur', lat: -38.6700, lon: -71.7600, elev: 1550 },
    { nombre: 'Antillanca',          zona: 'Sur', lat: -40.7780, lon: -72.1560, elev: 1050 },
    { nombre: 'Volcán Osorno',       zona: 'Sur', lat: -41.1053, lon: -72.4962, elev: 1200 },
    { nombre: 'El Fraile',           zona: 'Austral', lat: -45.6600, lon: -71.8000, elev: 1599 },
    { nombre: 'Club Andino · Cerro Mirador', zona: 'Austral', lat: -53.1300, lon: -71.0200, elev: 600 },
  ];

  const cache = {};
  function fitStage(){ const w = window.innerWidth || 1600, h = window.innerHeight || 900; $('stage').style.setProperty('--s', Math.min(w/1600, h/900) || 1); }
  window.addEventListener('resize', fitStage); window.addEventListener('load', fitStage); fitStage();

  function tick(){ const n = new Date();
    $('clock').textContent = n.toLocaleTimeString('es-CL', { timeZone:TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    $('clockDate').textContent = n.toLocaleDateString('es-CL', { timeZone:TZ, weekday:'long', day:'2-digit', month:'long' }) + ' · hora Chile';
  }

  function wmoIcon(c){
    const m = { 0:'sun',1:'cloud-sun',2:'cloud-sun',3:'cloud',45:'cloud-fog',48:'cloud-fog',51:'cloud-drizzle',53:'cloud-drizzle',55:'cloud-drizzle',
      61:'cloud-rain',63:'cloud-rain',65:'cloud-rain',71:'cloud-snow',73:'cloud-snow',75:'cloud-snow',77:'snowflake',80:'cloud-rain',81:'cloud-rain',82:'cloud-rain',
      85:'cloud-snow',86:'cloud-snow',95:'cloud-lightning',96:'cloud-lightning',99:'cloud-lightning' };
    return m[c] || 'cloud';
  }

  function apiUrl(c){
    return 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${c.lat}&longitude=${c.lon}&elevation=${c.elev}&timezone=${encodeURIComponent(TZ)}`
      + '&current=weather_code,wind_speed_10m,wind_gusts_10m,temperature_2m'
      + '&hourly=snow_depth,visibility'
      + '&daily=snowfall_sum'
      + '&wind_speed_unit=kmh&forecast_days=1&past_days=2';
  }
  function currentHourIndex(times){ const now = Date.now();
    for (let i = 0; i < times.length - 1; i++){ if (new Date(times[i]).getTime() <= now && now < new Date(times[i+1]).getTime()) return i; } return 0; }
  async function getData(i, force){
    if (!force && cache[i] && (Date.now() - cache[i].t < REFRESH_MS)) return cache[i].data;
    const r = await fetch(apiUrl(CENTROS[i])); if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json(); cache[i] = { t: Date.now(), data }; return data;
  }

  function estado(base, fresh, gust, visKm){
    if (base == null || base < 10) return { t:'Sin nieve suf.', c:'#94a3b8', n:-1, ic:'circle-slash' };
    let s = 0;
    if (base >= 120) s += 3; else if (base >= 70) s += 2; else if (base >= 35) s += 1;
    if (fresh >= 15) s += 2; else if (fresh >= 5) s += 1;
    if (gust >= 70) s -= 2; else if (gust >= 45) s -= 1;
    if (visKm != null && visKm < 2) s -= 1;
    if (s >= 4) return { t:'Excelentes', c:'#22d3ee', n:s, ic:'snowflake' };
    if (s >= 2) return { t:'Buenas',     c:'#34d399', n:s, ic:'thumbs-up' };
    if (s >= 1) return { t:'Regulares',  c:'#facc15', n:s, ic:'minus' };
    return { t:'Difíciles', c:'#fb923c', n:s, ic:'alert-triangle' };
  }

  function computeAll(){
    return CENTROS.map((c,i)=>{
      const d = cache[i]?.data; if (!d) return null;
      const hi = currentHourIndex(d.hourly.time);
      const depthM = d.hourly.snow_depth?.[hi];
      const base = depthM != null ? Math.round(depthM*100) : null;
      const fresh = d.daily.snowfall_sum?.[TODAY] ?? 0;
      const gust = d.current.wind_gusts_10m ?? 0;
      const visM = d.hourly.visibility?.[hi];
      const visKm = visM != null ? Math.round(visM/1000) : null;
      const est = estado(base, fresh, gust, visKm);
      return { c, i, base, fresh, gust, visKm, est, wcode: d.current.weather_code };
    }).filter(Boolean);
  }

  function render(){
    const rows = computeAll();
    if (!rows.length) return;
    rows.sort((a,b)=> b.est.n - a.est.n || (b.base??-1)-(a.base??-1));
    $('counter').textContent = `${rows.length} / ${CENTROS.length}`;

    // resumen
    const counts = {};
    rows.forEach(r=>{ counts[r.est.t] = (counts[r.est.t]||0)+1; });
    const order = [['Excelentes','#22d3ee'],['Buenas','#34d399'],['Regulares','#facc15'],['Difíciles','#fb923c'],['Sin nieve suf.','#94a3b8']];
    $('summaryChips').innerHTML = order.filter(o=>counts[o[0]]).map(o=>
      `<span class="pill text-xs px-3 py-1" style="background:${o[1]}1e;color:${o[1]};border:1px solid ${o[1]}55"><b class="tabnum">${counts[o[0]]}</b> ${o[0]}</span>`).join('');
    const best = rows[0];
    $('bestCentro').textContent = best.est.n >= 0 ? `${best.c.nombre} · ${best.est.t.toLowerCase()}` + (best.fresh>=5?` (+${Math.round(best.fresh)} cm hoy)`:'') : 'Sin condiciones destacadas';

    $('board').innerHTML = rows.map(r=>{
      const zc = ZCOL[r.c.zona], e = r.est;
      return `<div class="row-c px-4 py-3 flex items-center gap-3 fade" style="border-color:${e.c}33">
        <span class="h-9 w-9 rounded-xl grid place-items-center shrink-0" style="background:${e.c}1e;border:1px solid ${e.c}55"><i data-lucide="${e.ic}" class="w-5 h-5" style="color:${e.c}"></i></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold truncate text-slate-100">${r.c.nombre}</p>
          <p class="text-[11px]" style="color:${zc}">Zona ${r.c.zona}</p>
        </div>
        <span class="pill text-[11px] px-2.5 py-1 shrink-0" style="background:${e.c}1e;color:${e.c};border:1px solid ${e.c}55">${e.t}</span>
        <div class="hidden sm:flex items-center gap-3 shrink-0 w-[190px] justify-end">
          <div class="text-right"><p class="grotesk text-sm font-bold tabnum text-[#7dd3fc] leading-none">${r.base!=null?r.base:'--'}<span class="text-[10px] text-slate-500 font-normal"> base</span></p></div>
          <div class="text-right"><p class="grotesk text-sm font-bold tabnum leading-none ${r.fresh>=5?'text-white':'text-slate-300'}">+${(Math.round(r.fresh*10)/10)}<span class="text-[10px] text-slate-500 font-normal"> fresca</span></p></div>
          <div class="text-right"><p class="grotesk text-sm font-bold tabnum leading-none ${r.gust>=45?'text-[#fbbf24]':'text-slate-300'}">${round(r.gust)}<span class="text-[10px] text-slate-500 font-normal"> ráf.</span></p></div>
          <i data-lucide="${wmoIcon(r.wcode)}" class="w-5 h-5 text-slate-400 shrink-0"></i>
        </div>
      </div>`;
    }).join('');
    drawIcons();
  }

  async function loadAll(force){
    await Promise.allSettled(CENTROS.map((_,i)=>getData(i, force)));
    render();
  }
  $('refreshBtn').addEventListener('click', async () => { const ic = $('refreshIcon'); ic.classList.add('animate-spinSlow'); try { await loadAll(true); } catch(e){} finally { ic.classList.remove('animate-spinSlow'); } });

  drawIcons(); tick(); setInterval(tick, 1000);
  loadAll(false);
  setInterval(()=>loadAll(false), REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
</body>
</html>
